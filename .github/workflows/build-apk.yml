name: Build Offline APK & Deploy iOS PWA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/assets

      - name: Prepare Web Files and Android Project
        run: |
          rm -rf android www assets
          mkdir -p www assets
          cp icon.png assets/logo.png
          cp -r Pages index.html style.css app.js manifest.json sw.js icon.png quran-data.json www/
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Offline APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-Offline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy to GitHub Pages (iOS PWA)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
